<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Boil · Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9E7DF; --panel:#F4F2EC; --ink:#17171B;
    --blue:#2E6389; --blue-line:#9CCADD; --red:#A33B3B; --green:#3B7A4B;
    --line:rgba(23,23,27,0.14); --line-soft:rgba(23,23,27,0.07);
    --mono:'Space Mono',ui-monospace,monospace;
    --sans:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px 24px 40px;display:flex;flex-direction:column;gap:22px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap}
  .title{font-weight:700;font-size:26px;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:12px}
  .title .mark{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--blue-line);border:2px solid var(--blue);transform:translateY(1px)}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--blue);text-decoration:none}
  .login{max-width:360px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:22px}
  .login label{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase}
  .login input{font-family:var(--mono);font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:#fff;outline:none}
  .login input:focus{border-color:var(--blue)}
  .btn{font-family:var(--sans);font-weight:600;font-size:13.5px;padding:11px 16px;border-radius:2px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  .btn.ok{background:var(--green);border-color:var(--green);color:#fff}
  .btn.no{background:transparent;border-color:var(--red);color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .card .art{background:conic-gradient(from 0deg,#e6e4dc 0 25%,#f4f2ec 0 50%,#e6e4dc 0 75%,#f4f2ec 0) 0 0/20px 20px;border:1px solid var(--line-soft);border-radius:2px;display:flex;align-items:center;justify-content:center;min-height:180px;overflow:hidden}
  .card img{max-width:100%;max-height:260px;display:block}
  .card .who{font-family:var(--mono);font-size:11px;color:rgba(23,23,27,0.6);display:flex;justify-content:space-between}
  .card .who b{color:var(--ink)}
  .card .row{display:flex;gap:8px}
  .card .row .btn{flex:1}
  .msg{font-family:var(--mono);font-size:12px;color:rgba(23,23,27,0.55);text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:2px}
  .err{color:var(--red)}
  #board{display:none;flex-direction:column;gap:18px}
  .tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden;align-self:flex-start}
  .tabs button{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:10px 18px;
    background:transparent;border:none;border-right:1px solid var(--line);color:var(--ink);cursor:pointer;transition:background .12s,color .12s}
  .tabs button:last-child{border-right:none}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  .tabs .n{opacity:.6;margin-left:6px}
  .note{font-family:var(--mono);font-size:11px;color:rgba(23,23,27,0.5)}
  .card .row .btn.arm{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="mark"></span>Ink Boil · Admin</div>
    <a class="tag" href="/wall.html">→ public wall</a>
  </header>

  <div class="login" id="login">
    <label>Admin password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="btn" id="enter">Enter</button>
    <span class="msg err" id="loginMsg" style="display:none;border:none;padding:0"></span>
  </div>

  <div id="board">
    <div class="tabs" role="tablist">
      <button id="tabPending" role="tab" aria-selected="true">Pending<span class="n" id="nPending"></span></button>
      <button id="tabApproved" role="tab" aria-selected="false">On the wall<span class="n" id="nApproved"></span></button>
    </div>
    <div class="note" id="note" style="display:none">Taking a doodle down deletes it for good. The public wall catches up within a minute.</div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="empty" style="display:none"></div>
  </div>
</div>
<script>
(() => {
  const $=s=>document.querySelector(s);
  let pw=sessionStorage.getItem('inkboil-admin')||'';
  let scope='pending';

  async function api(method,body,q){
    const r=await fetch('/api/admin'+(q||''),{method,
      headers:{'Content-Type':'application/json','x-admin-password':pw},
      body:body?JSON.stringify(body):undefined});
    if(r.status===401) throw new Error('unauthorized');
    return r.json();
  }
  function card(it){
    const c=document.createElement('div'); c.className='card';
    const art=document.createElement('div'); art.className='art';
    const img=document.createElement('img'); img.src=it.gifUrl; art.appendChild(img); c.appendChild(art);
    const who=document.createElement('div'); who.className='who';
    const nm=document.createElement('b'); nm.textContent=it.name||'anonymous';
    const loc=document.createElement('span'); loc.textContent=it.location||'';
    who.appendChild(nm); who.appendChild(loc); c.appendChild(who);
    const row=document.createElement('div'); row.className='row';
    if(scope==='pending'){
      const ok=document.createElement('button'); ok.className='btn ok'; ok.textContent='Approve';
      const no=document.createElement('button'); no.className='btn no'; no.textContent='Deny';
      ok.onclick=()=>act(it.id,'approve',c); no.onclick=()=>act(it.id,'deny',c);
      row.appendChild(ok); row.appendChild(no);
    } else {
      // taking it down is final, so the button arms itself before it fires
      const rm=document.createElement('button'); rm.className='btn no'; rm.textContent='Take down';
      let armed=false, t=0;
      rm.onclick=()=>{
        if(!armed){ armed=true; rm.classList.add('arm'); rm.textContent='Take down — sure?';
          t=setTimeout(()=>{ armed=false; rm.classList.remove('arm'); rm.textContent='Take down'; },4000); return; }
        clearTimeout(t); act(it.id,'remove',c);
      };
      row.appendChild(rm);
    }
    c.appendChild(row);
    return c;
  }
  async function act(id,action,el){
    el.style.opacity=.4; el.querySelectorAll('button').forEach(b=>b.disabled=true);
    try{
      const r=await api('POST',{id,action});
      if(r&&r.error) throw new Error(r.error);
      el.remove(); count(scope,$('#grid').children.length);
      if(!$('#grid').children.length) $('#empty').style.display='block';
      if(action==='approve') count('approved',null);
    }
    catch(e){ el.style.opacity=1; el.querySelectorAll('button').forEach(b=>b.disabled=false); }
  }
  function count(which,n){
    const el=which==='pending'?$('#nPending'):$('#nApproved');
    el.textContent = n===null||n===undefined ? '' : '· '+n;
  }
  async function load(next){
    if(next) scope=next;
    const {items=[]}=await api('GET',null,scope==='approved'?'?scope=approved':'');
    $('#tabPending').setAttribute('aria-selected',String(scope==='pending'));
    $('#tabApproved').setAttribute('aria-selected',String(scope==='approved'));
    $('#note').style.display=scope==='approved'?'block':'none';
    count(scope,items.length);
    const grid=$('#grid'); grid.innerHTML='';
    items.forEach(it=>grid.appendChild(card(it)));
    $('#empty').textContent = scope==='approved'
      ? 'Nothing on the wall yet.' : 'No pending submissions. All clear.';
    $('#empty').style.display=items.length?'none':'block';
    $('#login').style.display='none'; $('#board').style.display='flex';
  }
  $('#tabPending').onclick=()=>load('pending').catch(()=>{});
  $('#tabApproved').onclick=()=>load('approved').catch(()=>{});
  $('#enter').onclick=async()=>{
    pw=$('#pw').value;
    try{ await load(); sessionStorage.setItem('inkboil-admin',pw); }
    catch(e){ const m=$('#loginMsg'); m.style.display='block'; m.textContent='Wrong password.'; }
  };
  $('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#enter').click(); });
  if(pw){ load().catch(()=>{ sessionStorage.removeItem('inkboil-admin'); }); }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Boil · Doodle Wall</title>
<style>
  :root{
    --ink:#000;
    --rule:#D1D1D1;
    --quiet:#454545;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:hidden}
  body{background:#fff;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;width:100%;max-width:1380px;margin:0 auto;padding:26px 32px 48px}
  @media(max-width:600px){.wrap{padding:20px 18px 40px}}

  /* ---------- masthead ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px}
  .brand{display:flex;flex-direction:column}
  .wallmark{display:block;overflow:visible;color:var(--ink)}
  .headnav{display:flex;align-items:baseline;gap:26px}
  .headnav a,.headnav button{font-family:var(--serif);font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:none;border:none;border-bottom:1px solid var(--rule);padding:0 0 2px;cursor:pointer;line-height:1.4}
  .headnav a:hover,.headnav button:hover{border-bottom-color:var(--ink)}
  .headnav a:active,.headnav button:active{opacity:0.5}
  .sheetrule{height:0;border-top:1px solid var(--rule);margin:0 calc(50% - 50vw)}

  /* ---------- the galley ---------- */
  .sheetclip{overflow:hidden;border-bottom:1px solid var(--rule)}
  .sheet{display:grid;grid-template-columns:1fr;margin:0 -2px -1px 0} /* -2 not -1: retina rounding can leave a sliver of the clipped edge rule */
  .cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
    --px:clamp(16px,2.2vw,30px);
    padding:clamp(18px,2.6vw,34px) var(--px) 15px;
    display:flex;flex-direction:column;background:#fff}
  .cell.blank{padding:0}
  @media(max-width:600px){.cell.blank{display:none}} /* a pause doesn't read in a single column */
  .piece{display:flex;flex-direction:column;flex:1;cursor:zoom-in;outline:none}
  .piece+.piece{border-top:1px solid var(--rule);margin:15px calc(var(--px) * -1) 0;padding:clamp(18px,2.6vw,34px) var(--px) 0}
  .piece .art{flex:1;display:flex;align-items:center;padding-bottom:13px}
  .piece img{width:100%;height:auto;display:block}
  .label{font-size:11px;line-height:1.55;letter-spacing:0.01em}
  .label{display:flex;justify-content:space-between;gap:14px}
  .label .name{color:var(--ink)}
  .label .name.anon{font-style:italic;color:var(--quiet)}
  .label .loc{color:var(--quiet);text-align:right}
  .label .loc a{color:var(--quiet);text-decoration:none;border-bottom:1px solid rgba(0,0,0,0.25)}
  .label .loc a:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .piece:focus-visible{outline:1px solid var(--ink);outline-offset:6px}

  /* two columns and up: vertical rules join the horizontal ones */
  @media(min-width:601px) and (max-width:980px){
    .sheet{grid-template-columns:repeat(6,1fr)}
    .sheet>*:nth-child(5n+1){grid-column:span 4}
    .sheet>*:nth-child(5n+2){grid-column:span 2}
    .sheet>*:nth-child(5n+3){grid-column:span 3}
    .sheet>*:nth-child(5n+4){grid-column:span 3}
    .sheet>*:nth-child(5n+5){grid-column:span 6}
  }
  @media(min-width:981px){
    .sheet{grid-template-columns:repeat(12,1fr)}
    .sheet>*:nth-child(9n+1){grid-column:span 5}
    .sheet>*:nth-child(9n+2){grid-column:span 4}
    .sheet>*:nth-child(9n+3){grid-column:span 3}
    .sheet>*:nth-child(9n+4){grid-column:span 7}
    .sheet>*:nth-child(9n+5){grid-column:span 5}
    .sheet>*:nth-child(9n+6){grid-column:span 4}
    .sheet>*:nth-child(9n+7){grid-column:span 8}
    .sheet>*:nth-child(9n+8){grid-column:span 6}
    .sheet>*:nth-child(9n+9){grid-column:span 6}
  }

  .empty{font-size:13px;font-style:italic;color:var(--quiet);text-align:center;padding:90px 20px;line-height:2}
  .empty a{color:var(--ink)}

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;background:#fff;z-index:30;display:flex;align-items:center;justify-content:center;padding:56px 72px;animation:lbIn 180ms ease-out}
  @keyframes lbIn{from{opacity:0}}
  .lb[hidden]{display:none}
  .lb figure{max-width:min(880px,100%);width:100%;display:flex;flex-direction:column;align-items:center}
  .lb img{max-width:100%;max-height:68vh;width:auto;height:auto;display:block}
  .lb figcaption{width:100%;max-width:560px;margin-top:26px;border-top:1px solid var(--rule);padding-top:10px}
  .lb .label{font-size:12.5px}
  .lb button{font-family:var(--serif);background:none;border:none;color:var(--ink);cursor:pointer;position:absolute;padding:10px 14px;font-size:24px;line-height:1}
  .lb button:hover{opacity:0.55}
  .lb button:active{opacity:0.35}
  .lb button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  .lb .x{top:14px;right:18px}
  .lb .prev{left:12px;top:50%;transform:translateY(-50%)}
  .lb .next{right:12px;top:50%;transform:translateY(-50%)}
  @media(max-width:600px){.lb{padding:56px 20px}.lb .prev{left:2px}.lb .next{right:2px}}

  a:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

  /* ---------- about ---------- */
  .about{margin:auto;width:min(440px,calc(100% - 36px));
    border:1px solid var(--rule);background:#fff;padding:34px 36px 30px;
    font-family:var(--serif);color:var(--ink);
    transition:opacity 220ms ease-out,transform 220ms ease-out}
  .about::backdrop{background:rgba(255,255,255,0.72);backdrop-filter:blur(5px);transition:opacity 220ms ease-out}
  .about[open]{opacity:1;transform:scale(1) translateY(0)}
  @starting-style{.about[open]{opacity:0;transform:scale(0.97)}}
  .about.closing{opacity:0;transform:scale(0.97)}   /* exit retraces the entrance */
  .about.closing::backdrop{opacity:0}
  .about h2{font-size:13px;font-weight:normal;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:18px}
  .about p{font-size:13.5px;line-height:1.75;margin-bottom:13px}
  .about p:last-of-type{margin-bottom:0}
  .about a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(0,0,0,0.3)}
  .about a:hover{border-bottom-color:var(--ink)}
  .about .x{position:absolute;top:8px;right:10px;font-family:var(--serif);font-size:20px;line-height:1;background:none;border:none;color:var(--ink);cursor:pointer;padding:8px 10px}
  .about .x:hover{opacity:0.55}
  .about .x:active{opacity:0.35}
  .about button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

  @media(prefers-reduced-motion:reduce){
    .about,.about::backdrop{transition:opacity 160ms ease}
    .about[open],.about.closing{transform:none}
    @starting-style{.about[open]{transform:none}}
    .lb{animation:none}
  }
  @media(prefers-reduced-transparency:reduce){
    .about::backdrop{background:rgba(255,255,255,0.96);backdrop-filter:none}
  }
</style>
</head>

.3,2.55-11.44,6.08-8.91,16.24-17.38,26.02-22.8,4.06-2.28,19-9.68,19.14-4.15-.16,2.22-3.68,6.79-8.01,11.89-5.76,6.49-11.44,13.32-18.22,18.85-6.83,5.32-15.87,10.96-21.41,7.71l-.07-.06Z"/><path fill="#fff" d="M1005.13,166.68c-4.45-2.9,1.82-19.13,4.82-24.45,2.07-3.89,10.39-17.06,15.35-13.45,3.63,5.38-2.1,16.58-5.37,22.41-3.18,5.16-9.97,16.12-14.73,15.52l-.07-.03Z"/><path fill="#fff" d="M1028.69,121.3c-2.26-1.42,4.82-11.48,7.04-11.72.46-.08.73.18.82.61.45,2.52-3.84,10.43-7.77,11.12l-.08-.02Z"/></g></svg>

<div class="sheetrule" role="presentation"></div>
<div class="wrap" style="padding-top:0;padding-bottom:0">
  <div class="sheetclip">
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="empty" id="empty" style="display:none">Nothing on the wall yet.<br>Draw something, boil it, and hit “Pin to the Doodle Wall”.</div>
</div>

<dialog class="about" id="about" aria-labelledby="aboutTitle">
  <button class="x" aria-label="Close">×</button>
  <h2 id="aboutTitle">About the wall</h2>
  <!-- Interim copy assembled from the product's own lines — awaiting the real text. -->
  <p>Every doodle here was drawn by hand, scanned, and boiled — by people like you.</p>
  <p>Draw something, lift it off the paper with <a href="/">Ink Boil</a>, and pin it. It appears here once approved.</p>
</dialog>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Doodle" tabindex="-1" hidden>
  <button class="x" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous doodle">‹</button>
  <button class="next" aria-label="Next doodle">›</button>
  <figure>
    <img id="lbImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAAIBAA7" alt="">
    <figcaption>
      <div class="label"><span class="name" id="lbName"></span><span class="loc" id="lbLoc"></span></div>
    </figcaption>
  </figure>
</div>

<script>
(async () => {
  const sheet=document.getElementById('sheet'), empty=document.getElementById('empty');
  const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
  const lbName=document.getElementById('lbName'), lbLoc=document.getElementById('lbLoc');
  let items=[];

  const fillLoc=(loc,it)=>{
    loc.textContent=it.location||'';
    if(it.handle){
      if(it.location) loc.appendChild(document.createTextNode(' · '));
      const a=document.createElement('a'); a.href='https://instagram.com/'+encodeURIComponent(it.handle);
      a.target='_blank'; a.rel='noopener'; a.textContent=it.handle;
      a.addEventListener('click',e=>e.stopPropagation());
      loc.appendChild(a);
    }
  };
  const caption=(it)=>{
    const label=document.createElement('div'); label.className='label';
    const nm=document.createElement('span'); nm.className='name'+(it.name?'':' anon'); nm.textContent=it.name||'anonymous';
    const loc=document.createElement('span'); loc.className='loc'; fillLoc(loc,it);
    label.appendChild(nm); label.appendChild(loc);
    return label;
  };
  const piece=(it,idx)=>{
    const p=document.createElement('div'); p.className='piece'; p.dataset.idx=idx;
    p.setAttribute('role','button'); p.tabIndex=0; p.setAttribute('aria-haspopup','dialog');
    p.setAttribute('aria-label',`View doodle by ${it.name||'anonymous'}${it.location?', '+it.location:''}`);
    const art=document.createElement('div'); art.className='art';
    const img=document.createElement('img'); img.src=it.gifUrl; img.loading='lazy';
    img.alt=`Boiling doodle by ${it.name||'anonymous'}`;
    art.appendChild(img); p.appendChild(art);
    p.appendChild(caption(it));
    p.addEventListener('click',()=>open(idx));
    p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open(idx);} });
    return p;
  };

  try{
    const r=await fetch('/api/wall'); ({items=[]}=await r.json());
    if(!items.length){ empty.style.display='block'; sheet.style.display='none'; return; }
    let i=0, cellN=0;
    while(i<items.length){
      cellN++;
      const cell=document.createElement('div'); cell.className='cell';
      if(items.length>5 && cellN%11===5){                 // an intentional pause in the galley
        cell.classList.add('blank'); cell.setAttribute('aria-hidden','true');
        sheet.appendChild(cell); continue;
      }
      cell.appendChild(piece(items[i],i)); i++;
      if(cellN%7===3 && i<items.length){                  // two-up column
        cell.appendChild(piece(items[i],i)); i++;
      }
      sheet.appendChild(cell);
    }
  }catch(e){ empty.style.display='block'; sheet.style.display='none'; empty.textContent='Could not load the wall right now.'; }

  /* ---------- lightbox ---------- */
  let cur=-1, lastFocus=null;
  function open(idx){
    cur=idx; const it=items[idx];
    lbImg.src=it.gifUrl; lbImg.alt=`Boiling doodle by ${it.name||'anonymous'}`;
    lbName.textContent=it.name||'anonymous'; lbName.className='name'+(it.name?'':' anon');
    fillLoc(lbLoc,it);
    lb.setAttribute('aria-label',`Doodle by ${it.name||'anonymous'}`);
    if(lb.hidden){ lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow='hidden'; lb.focus(); }
  }
  function close(){
    lb.hidden=true; document.body.style.overflow='';
    if(lastFocus && lastFocus.isConnected) lastFocus.focus();
    cur=-1;
  }
  const step=d=>{ if(cur<0)return; open((cur+d+items.length)%items.length); };
  lb.querySelector('.x').addEventListener('click',close);
  lb.querySelector('.prev').addEventListener('click',()=>step(-1));
  lb.querySelector('.next').addEventListener('click',()=>step(1));
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{
    if(lb.hidden) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft') step(-1);
    else if(e.key==='ArrowRight') step(1);
    else if(e.key==='Tab'){
      const f=[...lb.querySelectorAll('button,a')].filter(el=>el.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey && (document.activeElement===first||document.activeElement===lb)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- about ---------- */
  const about=document.getElementById('about');
  document.getElementById('aboutBtn').addEventListener('click',()=>about.showModal());
  function closeAbout(){
    if(about.classList.contains('closing')) return;
    about.classList.add('closing');
    const done=()=>{ about.close(); about.classList.remove('closing'); };
    matchMedia('(prefers-reduced-motion: reduce)').matches ? setTimeout(done,160) : setTimeout(done,230);
  }
  about.querySelector('.x').addEventListener('click',closeAbout);
  about.addEventListener('click',e=>{ if(e.target===about) closeAbout(); });          // the backdrop is the dialog's own hit area
  about.addEventListener('cancel',e=>{ e.preventDefault(); closeAbout(); });          // Esc exits along the entrance path too

  /* ---------- the wordmark boils too ---------- */
  const chromeNoise=[...document.querySelectorAll('feTurbulence[id^="chromeNoise"]')];
  if(chromeNoise.length && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    const seeds=[7,19,42]; let si=0;
    setInterval(()=>{ const s=seeds[si=(si+1)%seeds.length]; chromeNoise.forEach(n=>n.setAttribute('seed',s)); },140);
  }
})();
</script>
</body>
</html>
